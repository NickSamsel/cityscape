      - name: favorable_outside
        description: "{{ doc('mlb_ml_favorable_outside') }}"

  - name: ml_mlb__prediction_dataset
    description: |
      Feature table for *future* MLB batter vs probable-pitcher matchups on the next scheduled game date.
      Uses the latest available rolling hitter/pitcher stats as-of build time (not per-game realized stats).
      You can override the date by running with `--vars '{prediction_date: YYYY-MM-DD}'`.
    columns:
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
      - name: game_date
        description: "{{ doc('mlb_game_date') }}"
      - name: pitcher_id
        description: "{{ doc('mlb_pitcher_id') }}"
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
      - name: home_vs_away
        description: "{{ doc('mlb_ml_home_vs_away') }}"
      - name: batter_features_asof_date
        description: "Most recent game_date used to source hitter rolling features."
      - name: pitcher_features_asof_date
        description: "Most recent game_date used to source pitcher rolling features."

  - name: ml_mlb__daily_predictions
    description: |
      Daily MLB hit predictions from ML inference pipeline.
      Enriched with player names, team context, and game details for analysis.
      Sourced from ml_mlb__model_predictions_raw (populated by beat-the-streak-ml repo).
    columns:
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
      - name: game_date
        description: "{{ doc('mlb_game_date') }}"
        tests:
          - not_null
      - name: pitcher_id
        description: "{{ doc('mlb_pitcher_id') }}"
        tests:
          - not_null
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests:
          - not_null
      - name: hit_probability
        description: "Model-predicted probability of getting a hit (0.0-1.0)"
        tests:
          - not_null
      - name: model_version
        description: "Model version string (e.g., v3.0.0)"
        tests:
          - not_null
      - name: predicted_at
        description: "UTC timestamp when prediction was generated"
        tests:
          - not_null
      - name: player_name
        description: "Player's full name"
      - name: team_id
        description: "Player's team ID"
      - name: home_vs_away
        description: "1 = home, 0 = away"
      - name: opponent_team_id
        description: "Opposing team ID"

  - name: ml_mlb__prediction_outcomes
    description: |
      Resolved prediction outcomes joining predictions with actual batting results.
      Only includes completed games. Used for measuring model accuracy and performance tracking.
    columns:
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
      - name: game_date
        description: "{{ doc('mlb_game_date') }}"
        tests:
          - not_null
      - name: pitcher_id
        description: "{{ doc('mlb_pitcher_id') }}"
        tests:
          - not_null
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests:
          - not_null
      - name: hit_probability
        description: "Model-predicted probability of getting a hit (0.0-1.0)"
        tests:
          - not_null
      - name: model_version
        description: "Model version string (e.g., v3.0.0)"
      - name: got_hit
        description: "Actual outcome: true if player got at least one hit, false otherwise"
        tests:
          - not_null
      - name: actual_hits
        description: "Number of hits in the game"
      - name: actual_at_bats
        description: "Number of at-bats in the game"
      - name: prediction_correct
        description: "Whether the prediction was correct (using 0.50 threshold)"
        tests:
          - not_null
      - name: resolved_at
        description: "Timestamp when outcome was resolved"
        tests:
          - not_null
