  - name: ml_mlb__zone_matchup
    description: "{{ doc('mlb_ml_mlb_zone_matchup') }}"
    columns:
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
      - name: pitcher_id
        description: "{{ doc('mlb_pitcher_id') }}"
      - name: season
        description: "{{ doc('mlb_season') }}"

      - name: high_zone_matchup
        description: "{{ doc('mlb_ml_high_zone_matchup') }}"
      - name: middle_zone_matchup
