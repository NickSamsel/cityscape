        description: "{{ doc('nba_assist_to_turnover_ratio') }}"
      - name: defensive_plays_per_game
        description: "{{ doc('nba_defensive_plays_per_game') }}"

  - name: fct_nba__team_season_stats
    description: |
      Fact table containing NBA team season statistics.
      Each row represents a team's performance in a season including wins, losses, and scoring metrics.
    columns:
      - name: team_id
        description: "{{ doc('nba_team_id') }}"
        tests:
          - not_null
      - name: season
        description: "{{ doc('nba_season') }}"
        tests:
          - not_null
      - name: team_name
        description: "{{ doc('nba_team_name') }}"
      - name: team_abbr
