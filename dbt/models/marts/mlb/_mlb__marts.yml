  - name: fct_mlb__statcast_pitches
    description: |
      Analytics-ready fact table for pitch-level Statcast data.
      Each row represents a single pitch with complete context including pitcher, batter, game details,
      velocity, spin rate, and pitch location. Essential for pitch arsenal analysis, sequencing studies,
      and pitcher effectiveness evaluation.
    columns:
      - name: play_id
        description: "{{ doc('mlb_play_id') }}"
        tests:
          - unique
          - not_null
