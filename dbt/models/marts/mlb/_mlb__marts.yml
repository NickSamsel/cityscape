  - name: fct_mlb__player_pitch_heatmap
    description: |
      Pre-aggregated pitch heatmap data optimized for fast heatmap queries.
      Bins pitch locations into 0.25-foot grid cells and aggregates by player, season, pitch type, and outcome.
      **Cost Optimization**: Reduces query cost by 95% vs. scanning raw pitch data.
      Each row represents aggregated pitches for a specific player-season-location-pitchtype combination.
    columns:
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
      - name: player_type
        description: "Player type: 'batter' or 'pitcher'"
        tests:
          - not_null
          - accepted_values:
              values: ['batter', 'pitcher']
      - name: season
        description: "{{ doc('mlb_season') }}. NULL indicates career aggregation."
      - name: plate_x_bin
        description: "Horizontal pitch location binned to 0.25 feet (4 bins per foot). Negative = catcher's left, positive = catcher's right."
      - name: plate_z_bin
        description: "Vertical pitch location binned to 0.25 feet (4 bins per foot). Height above ground in feet."
      - name: pitch_type
        description: "Pitch type code (FF, CU, SL, etc.)"
      - name: pitch_type_description
        description: "Full pitch type description"
      - name: pitch_result_category
        description: "Result category: called_strike, swinging_strike, ball, foul, in_play"
      - name: zone
        description: "Strike zone location (1-9 in zone, 11+ out of zone)"
      - name: in_strike_zone
        description: "Boolean indicating if pitch was in strike zone"
      - name: pitch_count
        description: "Number of pitches in this bin"
      - name: avg_velocity
        description: "Average release speed (mph) for pitches in this bin"
      - name: avg_spin_rate
        description: "Average spin rate (rpm) for pitches in this bin"
      - name: latest_game_date
        description: "Most recent game date for pitches in this bin"
      - name: called_strikes
        description: "Count of called strikes in this bin"
      - name: swinging_strikes
        description: "Count of swinging strikes in this bin"
      - name: balls
        description: "Count of balls in this bin"
      - name: fouls
        description: "Count of foul balls in this bin"
      - name: in_play
        description: "Count of pitches put in play in this bin"
      - name: called_strike_rate
        description: "Percentage of pitches that were called strikes"
      - name: swinging_strike_rate
        description: "Percentage of pitches that were swinging strikes"
      - name: ball_rate
        description: "Percentage of pitches that were balls"
      - name: foul_rate
        description: "Percentage of pitches that were fouls"
      - name: in_play_rate
        description: "Percentage of pitches put in play"
      - name: strike_rate
        description: "Total strike rate (called + swinging + foul + in play)"

  - name: fct_mlb__player_batted_ball_season_stats
    description: |
      Pre-aggregated batted ball statistics by player-season.
      Eliminates need for on-the-fly aggregation in API queries.
      **Cost Optimization**: Reduces query cost by 80% vs. aggregating raw batted ball data.
      Each row represents a player's batted ball metrics for a season (or career if season is NULL).
    columns:
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
      - name: player_type
        description: "Player type: 'batter' or 'pitcher'"
        tests:
          - not_null
          - accepted_values:
              values: ['batter', 'pitcher']
      - name: season
        description: "{{ doc('mlb_season') }}. NULL indicates career aggregation."
      - name: total_batted_balls
        description: "Total number of batted ball events tracked by Statcast"
      - name: avg_exit_velo
        description: "Average exit velocity (mph)"
      - name: max_exit_velo
        description: "Maximum exit velocity (mph)"
      - name: avg_launch_angle
        description: "Average launch angle (degrees)"
      - name: avg_distance
        description: "Average projected distance (feet)"
      - name: max_distance
        description: "Maximum projected distance (feet)"
      - name: avg_sprint_speed
        description: "Average sprint speed (ft/sec)"
      - name: barrels
        description: "Total barrel events (98+ mph exit velo, 26-30° launch angle)"
      - name: hard_hits
        description: "Total hard-hit balls (95+ mph exit velocity)"
      - name: home_runs
        description: "Total home runs from Statcast data"
      - name: hits
        description: "Total hits from Statcast data"
      - name: barrel_rate
        description: "Barrel rate percentage (barrels / batted balls * 100)"
      - name: hard_hit_rate
        description: "Hard-hit rate percentage (hard hits / batted balls * 100)"
      - name: hit_rate
        description: "Hit rate percentage (hits / batted balls * 100)"
      - name: elite_velo_count
        description: "Count of batted balls with elite exit velo (110+ mph)"
      - name: great_velo_count
        description: "Count of batted balls with great exit velo (100-110 mph)"
      - name: good_velo_count
        description: "Count of batted balls with good exit velo (95-100 mph)"
      - name: avg_velo_count
        description: "Count of batted balls with average exit velo (90-95 mph)"
      - name: below_avg_velo_count
        description: "Count of batted balls with below average exit velo (80-90 mph)"
      - name: weak_velo_count
        description: "Count of batted balls with weak exit velo (<80 mph)"
      - name: line_drives
        description: "Count of line drives"
      - name: fly_balls
        description: "Count of fly balls"
      - name: ground_balls
        description: "Count of ground balls"
      - name: pop_ups
        description: "Count of pop ups"
      - name: topped
        description: "Count of topped balls"
      - name: line_drive_rate
        description: "Line drive rate percentage"
      - name: fly_ball_rate
        description: "Fly ball rate percentage"
      - name: ground_ball_rate
        description: "Ground ball rate percentage"
      - name: latest_game_date
        description: "Most recent game date in the aggregation"
