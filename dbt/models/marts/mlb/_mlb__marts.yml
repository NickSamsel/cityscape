version: 2

models:
  - name: dim_mlb__leagues
    description: |
      Dimension table containing MLB league reference data.
      Typically contains American League (AL) and National League (NL).
    columns:
      - name: league_id
        description: Unique identifier for the league
        tests:
          - not_null
          - unique
      - name: league_name
        description: Full league name (e.g., "American League")
      - name: league_abbr
        description: League abbreviation (e.g., "AL", "NL")

  - name: dim_mlb__divisions
    description: |
      Dimension table containing MLB division reference data.
      Each league is divided into three divisions: East, Central, and West.
    columns:
      - name: division_id
        description: Unique identifier for the division
        tests:
          - not_null
          - unique
      - name: division_name
        description: Full division name (e.g., "American League East")
      - name: division_abbr
        description: Division abbreviation (e.g., "ALE", "NLC")
      - name: league_id
        description: Foreign key to dim_mlb__leagues
        tests:
          - relationships:
              arguments:
                to: ref('dim_mlb__leagues')
                field: league_id

  - name: dim_mlb__teams
    description: |
      Dimension table containing MLB team information by season.
      This is a slowly changing dimension where teams can change leagues, divisions, 
      or even names between seasons.
    columns:
      - name: team_id
        description: Unique identifier for the team
        tests:
          - not_null
      - name: season
        description: Season year
        tests:
          - not_null
      - name: team_name
        description: Full team name (e.g., "New York Yankees")
      - name: team_abbr
        description: Team abbreviation code (e.g., "NYY")
      - name: league_id
        description: League identifier (American League or National League)
      - name: division_id
        description: Division identifier within the league

  - name: fct_mlb__games
    description: |
      Fact table containing MLB game results with complete team information and outcomes.
      Each row represents a single completed game.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - season
    columns:
      - name: game_id
        description: Unique identifier for the game
        tests:
          - not_null
      - name: season
        description: Season year
      - name: game_date
        description: Date the game was played
      - name: game_type
        description: Type of game (R=regular season, F=wild card, D=division series, etc.)
      - name: status
        description: Game status
      - name: home_team_id
        description: Home team identifier
      - name: home_team_name
        description: Home team full name
      - name: home_team_abbr
        description: Home team abbreviation
      - name: home_league_id
        description: Home team league ID
      - name: home_league_name
        description: Home team league name (e.g., 'American League')
      - name: home_league_abbr
        description: Home team league abbreviation (e.g., 'AL')
      - name: home_division_id
        description: Home team division ID
      - name: home_division_name
        description: Home team division name (e.g., 'American League East')
      - name: home_division_abbr
        description: Home team division abbreviation (e.g., 'ALE')
      - name: home_score
        description: Final score for home team
      - name: away_team_id
        description: Away team identifier
      - name: away_team_name
        description: Away team full name
      - name: away_team_abbr
        description: Away team abbreviation
      - name: away_league_id
        description: Away team league ID
      - name: away_league_name
        description: Away team league name (e.g., 'National League')
      - name: away_league_abbr
        description: Away team league abbreviation (e.g., 'NL')
      - name: away_division_id
        description: Away team division ID
      - name: away_division_name
        description: Away team division name (e.g., 'National League West')
      - name: away_division_abbr
        description: Away team division abbreviation (e.g., 'NLW')
      - name: away_score
        description: Final score for away team
      - name: winning_team_id
        description: Team ID of the winning team (null if tie)
      - name: losing_team_id
        description: Team ID of the losing team (null if tie)
      - name: winner
        description: Which team won - 'home', 'away', or 'tie'
      - name: score_differential
        description: Absolute difference between home and away scores
      - name: total_runs
        description: Total runs scored by both teams

  - name: fct_mlb__player_batting_stats
    description: |
      Fact table containing player batting statistics for each game.
      Each row represents a single player's batting performance in a game.
    columns:
      - name: game_id
        description: Foreign key to fct_mlb__games
        tests:
          - not_null
      - name: player_id
        description: Unique identifier for the player
        tests:
          - not_null
      - name: player_name
        description: Player's full name
      - name: team_id
        description: Foreign key to dim_mlb__teams
      - name: team_name
        description: Team full name
      - name: team_abbr
        description: Team abbreviation
      - name: league_id
        description: League ID
      - name: league_name
        description: League name (e.g., 'American League', 'National League')
      - name: league_abbr_name
        description: League abbreviation (e.g., 'AL', 'NL')
      - name: division_id
        description: Division ID
      - name: division_name
        description: Division name (e.g., 'American League East')
      - name: division_abbr_name
        description: Division abbreviation (e.g., 'ALE', 'NLW')
      - name: game_date
        description: Date of the game
      - name: season
        description: Season year
      - name: at_bats
        description: Number of official at bats
      - name: hits
        description: Total hits
      - name: singles
        description: Single base hits (calculated)
      - name: doubles
        description: Two-base hits
      - name: triples
        description: Three-base hits
      - name: home_runs
        description: Home runs
      - name: total_bases
        description: Total bases from all hits (1B + 2*2B + 3*3B + 4*HR)
      - name: avg
        description: Batting average
      - name: obp
        description: On-base percentage
      - name: slg
        description: Slugging percentage
      - name: ops
        description: On-base plus slugging
      - name: extra_base_hits
        description: "Total extra base hits in game (2B + 3B + HR). Measures power hitting and ability to hit for distance"
      - name: batting_avg_game
        description: "Single-game batting average (hits / at_bats). Snapshot of performance in this specific game"
      - name: slugging_pct_game
        description: "Single-game slugging percentage (total_bases / at_bats). Measures power output for the game"
      - name: iso
        description: "Isolated Power (slugging_pct - batting_avg). Measures raw power independent of batting average. ISO > .200 indicates strong power"
      - name: babip
        description: "Batting Average on Balls In Play ((H - HR) / (AB - K - HR)). Measures luck and quality of contact. League average ~.300"
      - name: walk_rate
        description: "Walk percentage (walks / plate_appearances * 100). Elite hitters maintain BB% > 12%"
      - name: strikeout_rate
        description: "Strikeout percentage (strikeouts / plate_appearances * 100). Elite contact hitters keep K% < 15%"
      - name: bb_k_ratio
        description: "Walk-to-strikeout ratio (walks / strikeouts). Measures plate discipline. Excellent hitters achieve BB/K > 1.0"
      - name: power_factor
        description: "Average bases per hit (total_bases / hits). Perfect contact (all singles) = 1.0, all homers = 4.0. Higher values indicate more power per hit"

  - name: fct_mlb__player_pitching_stats
    description: |
      Fact table containing player pitching statistics for each game.
      Each row represents a single pitcher's performance in a game.
    columns:
      - name: game_id
        description: Foreign key to fct_mlb__games
        tests:
          - not_null
      - name: player_id
        description: Unique identifier for the player
        tests:
          - not_null
      - name: player_name
        description: Player's full name
      - name: team_id
        description: Foreign key to dim_mlb__teams
      - name: team_name
        description: Team full name
      - name: team_abbr
        description: Team abbreviation
      - name: league_id
        description: League ID
      - name: league_name
        description: League name (e.g., 'American League', 'National League')
      - name: league_abbr_name
        description: League abbreviation (e.g., 'AL', 'NL')
      - name: division_id
        description: Division ID
      - name: division_name
        description: Division name (e.g., 'American League East')
      - name: division_abbr_name
        description: Division abbreviation (e.g., 'ALE', 'NLW')
      - name: game_date
        description: Date of the game
      - name: season
        description: Season year
      - name: innings_pitched
        description: Innings pitched in X.Y format (e.g., 5.2 = 5 2/3 innings)
      - name: innings_pitched_decimal
        description: Innings pitched converted to decimal format
      - name: strikeouts
        description: Number of strikeouts recorded
      - name: walks
        description: Number of walks issued
      - name: hits
        description: Hits allowed
      - name: earned_runs
        description: Earned runs allowed
      - name: strike_percentage
        description: Percentage of pitches that were strikes
      - name: whip
        description: Walks plus hits per inning pitched
      - name: k_per_nine
        description: Strikeouts per 9 innings
      - name: bb_per_nine
        description: Walks per 9 innings
      - name: era
        description: Earned run average
      - name: k_bb_ratio
        description: "Strikeout-to-walk ratio (K/BB). Measures command and control. Elite pitchers maintain K/BB > 4.0, with excellent pitchers above 3.0"
      - name: hr_per_nine
        description: "Home runs allowed per 9 innings. Measures ability to limit power. Elite pitchers keep HR/9 below 1.0"
      - name: h_per_nine
        description: "Hits allowed per 9 innings. Lower is better; dominant pitchers maintain H/9 < 7.0"
      - name: fip
        description: "Fielding Independent Pitching ((13*HR + 3*BB - 2*K) / IP + 3.2). Estimates pitcher ERA if they faced league-average defense and luck. FIP < 3.00 = excellent, 3.00-3.75 = above average, 3.75-4.00 = average"
      - name: pitches_per_inning
        description: "Average pitches thrown per inning pitched. Efficient pitchers stay below 15 pitches/inning; high counts may indicate control issues or batters working deep counts"
      - name: k_percentage
        description: "Strikeout percentage (K / total batters faced * 100). Elite strikeout pitchers achieve K% > 27%, very good is 23-27%"
      - name: is_quality_start
        description: "Boolean indicator of quality start (IP >= 6.0 AND ER <= 3). Quality starts represent consistent, effective outings that give the team a chance to win"

  - name: fct_mlb__statcast_pitches
    description: |
      Analytics-ready fact table for pitch-level Statcast data.
      Each row represents a single pitch with complete context including pitcher, batter, game details, 
      velocity, spin rate, and pitch location. Essential for pitch arsenal analysis, sequencing studies,
      and pitcher effectiveness evaluation.
    columns:
      - name: play_id
        description: "Unique identifier for the pitch (game_id_atbat_pitchnum)"
        tests:
          - unique
          - not_null
      - name: game_id
        description: "MLB game identifier"
        tests:
          - not_null
      - name: pitcher_id
        description: "MLB player ID for the pitcher"
        tests:
          - not_null
      - name: batter_id
        description: "MLB player ID for the batter"
        tests:
          - not_null
      - name: release_speed
        description: "Pitch velocity in mph. Fastballs typically 90-100+ mph, breaking balls 70-85 mph"
      - name: release_spin_rate
        description: "Pitch spin rate in rpm. Higher spin creates more movement. Fastballs: 2200-2800 rpm, curves: 2500-3000 rpm"
      - name: zone
        description: "Strike zone location (1-9 in zone, 11+ out of zone). Zones 1-9 map to a 3x3 grid over home plate"
      - name: pitch_type
        description: "Pitch type code (FF=four-seam, SI=sinker, SL=slider, CU=curveball, CH=changeup, etc.)"
      - name: velocity_tier
        description: "Velocity classification bucket (Elite 98+/Above Average 95-97/Average 92-94/Below Average 88-91/Soft <88)"
      - name: pitcher_batter_handedness
        description: "Handedness matchup (Same/Opposite). Opposite-handed matchups generally favor the batter"
    
  - name: fct_mlb__statcast_batted_balls
    description: |
      Analytics-ready fact table for batted ball Statcast data.
      Each row represents a single batted ball with exit velocity, launch angle, distance, and outcome.
      Critical for evaluating batter quality of contact, expected outcomes, and defensive positioning.
    columns:
      - name: play_id
        description: "Unique identifier for the batted ball (game_id_atbat_pitchnum)"
        tests:
          - unique
          - not_null
      - name: game_id
        description: "MLB game identifier"
        tests:
          - not_null
      - name: batter_id
        description: "MLB player ID for the batter"
        tests:
          - not_null
      - name: pitcher_id
        description: "MLB player ID for the pitcher"
        tests:
          - not_null
      - name: launch_speed
        description: "Exit velocity in mph. Elite contact: 110+, hard hit: 95+, average: 85-95, weak: <85"
      - name: launch_angle
        description: "Launch angle in degrees. Optimal for power: 25-35°, line drives: 10-25°, ground balls: <10°"
      - name: launch_distance
        description: "Projected carry distance in feet. Home run distance typically 350-450+ feet"
      - name: is_barrel
        description: "Boolean for barrel (98+ mph exit velo AND 26-30° launch angle). Barrels have .500 BA, 1.500 SLG"
      - name: is_hard_hit
        description: "Boolean for hard hit (95+ mph exit velocity). Hard-hit rate is strong predictor of offensive production"
      - name: exit_velo_tier
        description: "Exit velocity bucket (Elite 110+/Great 100-109/Good 95-99/Average 90-94/Below Average 80-89/Weak <80)"
      - name: trajectory_bucket
        description: "Batted ball type (Pop Up 50+/Fly Ball 25-49/Line Drive 10-24/Ground Ball -10 to 9/Topped < -10)"
      - name: quality_contact_tier
        description: "Contact quality classification (Barrel/Hard Hit Non-Barrel/Not Hard Hit)"
      - name: is_home_run
        description: "Boolean flag indicating if the batted ball resulted in a home run"
      - name: is_hit
        description: "Boolean flag indicating if the batted ball resulted in any hit (single/double/triple/HR)"

  - name: fct_mlb__player_season_stats
    description: |
      Comprehensive player season statistics combining traditional batting stats with Statcast metrics.
      Each row represents a player's performance for their primary team in a season.
      Includes MLB Savant-style percentile rankings (0-100 scale) for key metrics.
      For players who changed teams mid-season, stats are aggregated for their primary team (most games played).
    columns:
      - name: player_id
        description: "MLB player ID"
        tests:
          - not_null
      - name: team_id
        description: "Primary team ID (team with most games played if player changed teams)"
        tests:
          - not_null
      - name: season
        description: "MLB season year"
        tests:
          - not_null
      - name: games_played
        description: "Games played for primary team"
      - name: games_with_batted_balls
        description: "Games with Statcast batted ball data"
      - name: at_bats
        description: "Official at-bats"
      - name: hits
        description: "Total hits (singles + doubles + triples + home runs)"
      - name: doubles
        description: "Doubles"
      - name: triples
        description: "Triples"
      - name: home_runs_traditional
        description: "Home runs from traditional box score stats"
      - name: rbi
        description: "Runs batted in"
      - name: runs
        description: "Runs scored"
      - name: walks
        description: "Walks (base on balls)"
      - name: strikeouts
        description: "Strikeouts"
      - name: stolen_bases
        description: "Stolen bases"
      - name: total_batted_balls
        description: "Total Statcast batted ball events"
      - name: max_exit_velocity
        description: "Maximum exit velocity (mph) - key power indicator"
      - name: avg_exit_velocity
        description: "Average exit velocity (mph) - quality of contact"
      - name: p90_exit_velocity
        description: "90th percentile exit velocity (mph)"
      - name: stddev_exit_velocity
        description: "Standard deviation of exit velocity"
      - name: avg_launch_angle
        description: "Average launch angle (degrees)"
      - name: stddev_launch_angle
        description: "Standard deviation of launch angle"
      - name: avg_launch_distance
        description: "Average projected distance (feet)"
      - name: max_launch_distance
        description: "Maximum projected distance (feet)"
      - name: total_barrels
        description: "Total barrel events (98+ mph, 26-30° launch angle)"
      - name: total_hard_hits
        description: "Total hard-hit balls (95+ mph exit velocity)"
      - name: home_runs_statcast
        description: "Home runs from Statcast data"
      - name: hits_statcast
        description: "Hits from Statcast data"
      - name: barrel_rate
        description: "Barrels per batted ball - MLB average ~8%, elite 15%+"
      - name: hard_hit_rate
        description: "Hard hits per batted ball - MLB average ~35%, elite 50%+"
      - name: home_run_rate
        description: "Home runs per batted ball"
      - name: fly_balls
        description: "Count of fly balls"
      - name: line_drives
        description: "Count of line drives"
      - name: ground_balls
        description: "Count of ground balls"
      - name: popups
        description: "Count of pop ups"
      - name: avg_sprint_speed
        description: "Average sprint speed (ft/sec) - MLB average ~27 ft/sec"
      - name: max_sprint_speed
        description: "Maximum sprint speed (ft/sec)"
      - name: batting_average
        description: "Batting average (hits / at-bats)"
      - name: on_base_percentage
        description: "On-base percentage ((hits + walks) / (at-bats + walks))"
      - name: slugging_percentage
        description: "Slugging percentage (total bases / at-bats)"
      - name: exit_velo_percentile
        description: "Percentile rank (0-100) for max exit velocity within season - matches MLB Savant"
      - name: avg_exit_velo_percentile
        description: "Percentile rank (0-100) for avg exit velocity within season"
      - name: home_run_percentile
        description: "Percentile rank (0-100) for home runs within season"
      - name: barrel_rate_percentile
        description: "Percentile rank (0-100) for barrel rate within season"
      - name: hard_hit_rate_percentile
        description: "Percentile rank (0-100) for hard hit rate within season"
      - name: max_distance_percentile
        description: "Percentile rank (0-100) for max launch distance within season"
      - name: sprint_speed_percentile
        description: "Percentile rank (0-100) for avg sprint speed within season"

  - name: fct_mlb__team_game_stats
    description: |
      Fact table containing team-level statistics for each game.
      Aggregates player batting and pitching stats to the team level.
      Each row represents a single team's performance in a game (two rows per game).
      Includes traditional counting stats, rate stats, and game-level Statcast metrics.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - team_id
    columns:
      - name: game_id
        description: "Unique identifier for the game"
        tests:
          - not_null
      - name: team_id
        description: "Team identifier"
        tests:
          - not_null
      - name: team_name
        description: "Full team name"
      - name: team_abbr
        description: "Team abbreviation"
      - name: season
        description: "Season year"
      - name: game_date
        description: "Date the game was played"
      - name: game_type
        description: "Type of game (R=regular, F=wild card, D=division series, etc.)"
      - name: home_away
        description: "Whether the team was home or away"
      - name: opponent_team_id
        description: "Opposing team identifier"
      - name: opponent_team_name
        description: "Opposing team full name"
      - name: runs_scored
        description: "Runs scored by this team"
      - name: runs_allowed
        description: "Runs allowed by this team"
      - name: run_differential
        description: "Runs scored minus runs allowed (positive = win margin)"
      - name: is_win
        description: "Whether this team won the game"
      - name: is_loss
        description: "Whether this team lost the game"
      - name: team_batting_avg
        description: "Team batting average for the game"
      - name: team_ops
        description: "Team OPS (on-base plus slugging) for the game"
      - name: team_era
        description: "Team ERA for the game"
      - name: team_whip
        description: "Team WHIP for the game"
      - name: team_avg_exit_velocity
        description: "Team average exit velocity (Statcast) for the game"
      - name: team_barrel_rate
        description: "Team barrel rate (Statcast) for the game"

  - name: fct_mlb__team_season_stats
    description: |
      Fact table containing team season-level statistics.
      Aggregates game-level team stats into season totals and averages.
      Regular season games only. Each row represents a team's full season performance.
      Includes W-L record, Pythagorean expectation, batting, pitching, and Statcast metrics.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - season
    columns:
      - name: team_id
        description: "Team identifier"
        tests:
          - not_null
      - name: season
        description: "Season year"
        tests:
          - not_null
      - name: team_name
        description: "Full team name"
      - name: team_abbr
        description: "Team abbreviation"
      - name: games_played
        description: "Total regular season games played"
      - name: wins
        description: "Total wins"
      - name: losses
        description: "Total losses"
      - name: win_pct
        description: "Winning percentage (wins / games played)"
      - name: home_wins
        description: "Wins at home"
      - name: home_losses
        description: "Losses at home"
      - name: away_wins
        description: "Wins on the road"
      - name: away_losses
        description: "Losses on the road"
      - name: total_runs_scored
        description: "Total runs scored in the season"
      - name: total_runs_allowed
        description: "Total runs allowed in the season"
      - name: total_run_differential
        description: "Season run differential (scored minus allowed)"
      - name: pythagorean_win_pct
        description: "Expected win% based on runs scored/allowed: RS^2 / (RS^2 + RA^2)"
      - name: luck_factor
        description: "Actual win% minus Pythagorean win%. Positive = outperforming run differential"
      - name: season_batting_avg
        description: "Team season batting average"
      - name: season_ops
        description: "Team season OPS"
      - name: season_era
        description: "Team season ERA"
      - name: season_whip
        description: "Team season WHIP"
      - name: season_barrel_rate
        description: "Team season barrel rate (Statcast)"
      - name: season_hard_hit_rate
        description: "Team season hard-hit rate (Statcast)"

  - name: fct_mlb__team_statcast_metrics
    description: |
      Fact table for granular team-level Statcast metrics by season.
      Aggregates pitch-level and batted-ball-level Statcast data to the team level.
      Provides deeper Statcast analytics than the season stats table, including
      velocity distributions, batted ball profiles, whiff rates, and contact quality.
      Each row represents a team's Statcast profile for a season.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - season
    columns:
      - name: team_id
        description: "Team identifier"
        tests:
          - not_null
      - name: season
        description: "Season year"
        tests:
          - not_null
      - name: team_name
        description: "Full team name"
      - name: avg_exit_velocity
        description: "Team average exit velocity (mph) on batted balls"
      - name: max_exit_velocity
        description: "Team max exit velocity (mph) on batted balls"
      - name: p90_exit_velocity
        description: "90th percentile exit velocity (mph)"
      - name: barrel_rate
        description: "Team barrel rate (barrels / batted balls)"
      - name: hard_hit_rate
        description: "Team hard-hit rate (95+ mph / batted balls)"
      - name: fly_ball_rate
        description: "Fly ball rate (fly balls / batted balls)"
      - name: line_drive_rate
        description: "Line drive rate (line drives / batted balls)"
      - name: ground_ball_rate
        description: "Ground ball rate (ground balls / batted balls)"
      - name: avg_sprint_speed
        description: "Team average sprint speed (ft/sec)"
      - name: staff_avg_velocity
        description: "Pitching staff average velocity (mph)"
      - name: staff_max_velocity
        description: "Pitching staff max velocity (mph)"
      - name: staff_avg_spin_rate
        description: "Pitching staff average spin rate (rpm)"
      - name: staff_zone_rate
        description: "Rate of pitches thrown in the strike zone"
      - name: staff_strike_rate
        description: "Rate of pitches resulting in strikes (called, swinging, foul)"
      - name: staff_whiff_rate
        description: "Rate of pitches resulting in swinging strikes"
      - name: elite_velocity_pct
        description: "Percentage of pitches at 98+ mph"
      - name: staff_unique_pitch_types
        description: "Number of distinct pitch types used by the staff"

  - name: fct_mlb__standings
    description: |
      Fact table containing MLB standings snapshots over time.
      Each row represents a team's standings record on a specific date.
      Supports weekly historical data back to 2000 for division race tracking,
      playoff positioning analysis, and momentum trends.
      Includes Pythagorean win expectation, luck factor, and inter-snapshot momentum.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - season
              - standings_date
    columns:
      - name: team_id
        description: "Team identifier"
        tests:
