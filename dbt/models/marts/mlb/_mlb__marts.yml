version: 2

models:
  - name: dim_mlb__leagues
    description: |
      Dimension table containing MLB league reference data.
      Typically contains American League (AL) and National League (NL).
    columns:
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
        tests:
          - not_null
          - unique
      - name: league_name
        description: "{{ doc('mlb_league_name') }}"
      - name: league_abbr
        description: "{{ doc('mlb_league_abbr') }}"

  - name: dim_mlb__divisions
    description: |
      Dimension table containing MLB division reference data.
      Each league is divided into three divisions: East, Central, and West.
    columns:
      - name: division_id
        description: "{{ doc('mlb_division_id') }}"
        tests:
          - not_null
          - unique
      - name: division_name
        description: "{{ doc('mlb_division_name') }}"
      - name: division_abbr
        description: "{{ doc('mlb_division_abbr') }}"
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
        tests:
          - relationships:
              arguments:
                to: ref('dim_mlb__leagues')
                field: league_id

  - name: dim_mlb__teams
    description: |
      Dimension table containing MLB team information by season.
      This is a slowly changing dimension where teams can change leagues, divisions,
      or even names between seasons.
    columns:
      - name: team_id
        description: "{{ doc('mlb_team_id') }}"
        tests:
          - not_null
      - name: season
        description: "{{ doc('mlb_season') }}"
        tests:
          - not_null
      - name: team_name
        description: "{{ doc('mlb_team_name') }}"
      - name: team_abbr
        description: "{{ doc('mlb_team_abbr') }}"
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
      - name: division_id
        description: "{{ doc('mlb_division_id') }}"

  - name: dim_mlb__venues
    description: |
      Dimension table containing MLB venue (ballpark) attributes.
      Type 2 Slowly Changing Dimension - one row per venue_id per season.
      Tracks venue attribute changes over time (capacity, turf, dimensions, etc).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - venue_id
              - season
    columns:
      - name: venue_id
        description: "{{ doc('mlb_venue_id') }}"
        tests:
          - not_null
      - name: venue_name
        description: "{{ doc('mlb_venue_name') }}"
      - name: city
        description: "{{ doc('mlb_venue_city') }}"
      - name: country
        description: "{{ doc('mlb_venue_country') }}"

  - name: dim_mlb__players
    description: |
      Dimension table containing MLB player reference data.
      One row per player_id (current attributes).
    columns:
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
          - unique
      - name: full_name
        description: "{{ doc('mlb_full_name') }}"
      - name: primary_position_abbr
        description: "{{ doc('mlb_primary_position_abbr') }}"
      - name: active
        description: "{{ doc('mlb_active') }}"

  - name: fct_mlb__games
    description: |
      Fact table containing MLB game results with complete team information and outcomes.
      Each row represents a single completed game.
    tests:
      - dbt_utils.unique_combination_of_columns:
