  - name: fct_mlb__player_pitch_heatmap
    description: |
      Pre-aggregated pitch heatmap data optimized for fast heatmap queries.
      Bins pitch locations into 0.25-foot grid cells and aggregates by player, season, pitch type, and outcome.
