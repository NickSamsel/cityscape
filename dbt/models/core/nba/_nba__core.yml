version: 2

models:
  - name: core_nba__player_season_stats
    description: |
      Core NBA player season statistics aggregated from game-level data.
      Each row represents a player's performance for a team in a season.
      Includes traditional stats and advanced analytics like true shooting %, effective FG %, assist/TO ratio.
    columns:
      - name: player_id
        description: "{{ doc('nba_player_id') }}"
        tests:
          - not_null
      - name: team_id
        description: "{{ doc('nba_team_id') }}"
        tests:
          - not_null
      - name: season
        description: "{{ doc('nba_season') }}"
        tests:
          - not_null
      - name: team_name
        description: "{{ doc('nba_team_name') }}"
      - name: team_abbr
        description: "{{ doc('nba_team_abbr') }}"
      - name: player_name
        description: "{{ doc('nba_player_name') }}"
      - name: position
        description: "{{ doc('nba_position') }}"
      - name: games_played
        description: "{{ doc('nba_games_played') }}"
      - name: games_started
        description: "{{ doc('nba_games_started') }}"
      - name: starter_percentage
        description: "{{ doc('nba_starter_percentage') }}"
      - name: total_field_goals_made
        description: "{{ doc('nba_total_field_goals_made') }}"
      - name: total_field_goals_attempted
        description: "{{ doc('nba_total_field_goals_attempted') }}"
      - name: field_goal_percentage
        description: "{{ doc('nba_field_goal_percentage') }}"
      - name: total_three_pointers_made
        description: "{{ doc('nba_total_three_pointers_made') }}"
      - name: total_three_pointers_attempted
        description: "{{ doc('nba_total_three_pointers_attempted') }}"
      - name: three_point_percentage
        description: "{{ doc('nba_three_point_percentage') }}"
      - name: total_free_throws_made
        description: "{{ doc('nba_total_free_throws_made') }}"
      - name: total_free_throws_attempted
        description: "{{ doc('nba_total_free_throws_attempted') }}"
      - name: free_throw_percentage
        description: "{{ doc('nba_free_throw_percentage') }}"
      - name: total_offensive_rebounds
        description: "{{ doc('nba_total_offensive_rebounds') }}"
      - name: total_defensive_rebounds
        description: "{{ doc('nba_total_defensive_rebounds') }}"
      - name: total_rebounds
        description: "{{ doc('nba_total_rebounds') }}"
      - name: rebounds_per_game
        description: "{{ doc('nba_rebounds_per_game') }}"
      - name: total_assists
        description: "{{ doc('nba_total_assists') }}"
      - name: assists_per_game
        description: "{{ doc('nba_assists_per_game') }}"
      - name: total_steals
        description: "{{ doc('nba_total_steals') }}"
      - name: steals_per_game
        description: "{{ doc('nba_steals_per_game') }}"
      - name: total_blocks
        description: "{{ doc('nba_total_blocks') }}"
      - name: blocks_per_game
        description: "{{ doc('nba_blocks_per_game') }}"
      - name: total_turnovers
        description: "{{ doc('nba_total_turnovers') }}"
      - name: turnovers_per_game
        description: "{{ doc('nba_turnovers_per_game') }}"
      - name: total_personal_fouls
        description: "{{ doc('nba_total_personal_fouls') }}"
      - name: total_points
        description: "{{ doc('nba_total_points') }}"
      - name: points_per_game
        description: "{{ doc('nba_points_per_game') }}"
      - name: true_shooting_percentage
        description: "{{ doc('nba_true_shooting_percentage') }}"
      - name: effective_field_goal_percentage
