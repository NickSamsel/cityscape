version: 2

models:
  - name: core_mlb__player_batting_stats
    description: "Final production MLB player batting statistics with calculated metrics"
    columns:
      - name: game_id
        description: "Unique identifier for the game"
        tests: [not_null]
      - name: player_id
        description: "Unique identifier for the player"
        tests: [not_null]
      - name: player_name
        description: "Player's name"
      - name: team_id
        description: "Unique identifier for the team"
      - name: team_name
        description: "Team name"
      - name: team_abbr
        description: "Team abbreviation"
      - name: game_date
        description: "Date of the game"
      - name: season
        description: "MLB season year"
      - name: game_type
        description: "Type of game (R=regular, S=spring, F=wild card, etc.)"
      - name: batting_order
        description: "Batting order position"
      - name: position
        description: "Defensive position"
      - name: at_bats
        description: "Number of at-bats"
      - name: runs
        description: "Number of runs scored"
      - name: hits
        description: "Number of hits"
      - name: doubles
        description: "Number of doubles (2B)"
      - name: triples
        description: "Number of triples (3B)"
      - name: home_runs
        description: "Number of home runs (HR)"
      - name: rbi
        description: "Runs batted in"
      - name: stolen_bases
        description: "Number of stolen bases"
      - name: walks
        description: "Number of walks (BB)"
      - name: strikeouts
        description: "Number of strikeouts"
      - name: left_on_base
        description: "Number of runners left on base"
      - name: singles
        description: "Calculated number of singles (1B)"
      - name: total_bases
        description: "Calculated total bases (1B + 2*2B + 3*3B + 4*HR)"
      - name: avg
        description: "Season batting average as of this game"
      - name: obp
        description: "Season on-base percentage as of this game"
      - name: slg
        description: "Season slugging percentage as of this game"
      - name: ops
        description: "Season on-base plus slugging as of this game"
