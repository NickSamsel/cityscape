version: 2

models:
  - name: core_mlb__player_pitching_stats
    description: "Final production MLB player pitching statistics with calculated metrics"
    columns:
      - name: game_id
        description: "Unique identifier for the game"
        tests: [not_null]
      - name: player_id
        description: "Unique identifier for the player"
        tests: [not_null]
      - name: player_name
        description: "Player's name"
      - name: team_id
        description: "Unique identifier for the team"
      - name: team_name
        description: "Team name"
      - name: team_abbr
        description: "Team abbreviation"
      - name: game_date
        description: "Date of the game"
      - name: season
        description: "MLB season year"
      - name: game_type
        description: "Type of game (R=regular, S=spring, F=wild card, etc.)"
      - name: innings_pitched
        description: "Innings pitched string format (e.g., '5.2' for 5 2/3 innings)"
      - name: innings_pitched_decimal
        description: "Innings pitched in decimal format for calculations"
      - name: hits
        description: "Number of hits allowed"
      - name: runs
        description: "Number of runs allowed"
      - name: earned_runs
        description: "Number of earned runs allowed"
      - name: walks
        description: "Number of walks issued (BB)"
      - name: strikeouts
        description: "Number of strikeouts"
      - name: home_runs
        description: "Number of home runs allowed"
      - name: pitches
        description: "Total number of pitches thrown"
      - name: strikes
        description: "Number of strikes thrown"
      - name: strike_percentage
        description: "Calculated strike percentage for this game"
      - name: whip
        description: "Calculated WHIP (Walks + Hits per Inning Pitched) for this game"
      - name: era
        description: "Season earned run average as of this game"
