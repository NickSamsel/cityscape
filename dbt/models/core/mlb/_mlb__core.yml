version: 2

models:
  - name: core_mlb__games
    description: |
      Core MLB games model with team information and derived game outcome fields.
      Promotes game result logic from the intermediate layer into a stable core table.
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests: 
          - unique
      - name: season
        description: "{{ doc('mlb_season') }}"
      - name: game_date
        description: "{{ doc('mlb_game_date') }}"
      - name: game_type
        description: "{{ doc('mlb_game_type') }}"
      - name: status
        description: "{{ doc('mlb_game_status') }}"
      - name: home_team_id
        description: "{{ doc('mlb_home_team_id') }}"
