version: 2

models:
  - name: stg_mlb__games
    description: |
      MLB games staged from raw landing tables.
      Includes deduplication logic to ensure unique (game_id, season) combinations.
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests: 
          - not_null
          - unique
      - name: season
        description: "{{ doc('mlb_season') }}"
        tests:
          - not_null
      - name: game_date
        description: "{{ doc('mlb_game_date') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('mlb_game_type') }}"
      - name: status
        description: "{{ doc('mlb_game_status') }}"
      - name: home_team_id
        description: "{{ doc('mlb_home_team_id') }}"
        tests:
          - not_null
      - name: away_team_id
        description: "{{ doc('mlb_away_team_id') }}"
        tests:
          - not_null
      - name: home_score
        description: "{{ doc('mlb_home_score') }}"
      - name: away_score
        description: "{{ doc('mlb_away_score') }}"

  - name: stg_mlb__teams
    description: "MLB teams staged from raw landing tables"
    columns:
      - name: team_id
        description: "{{ doc('mlb_team_id') }}"
        tests:
          - not_null
      - name: season
        description: "{{ doc('mlb_season') }}"
        tests:
          - not_null
      - name: team_name
        description: "{{ doc('mlb_team_name') }}"
        tests:
          - not_null
      - name: team_abbr
        description: "{{ doc('mlb_team_abbr') }}"
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
      - name: division_id
        description: "{{ doc('mlb_division_id') }}"

  - name: stg_mlb__player_batting_stats
    description: |
      MLB player batting statistics staged from raw landing tables.
      Contains game-by-game batting stats for each player.
    columns:
      - name: game_id
        description: "Unique identifier for the game"
        tests:
          - not_null
      - name: player_id
        description: "Unique identifier for the player"
        tests:
          - not_null
      - name: team_id
        description: "Unique identifier for the team"
        tests:
          - not_null
      - name: player_name
        description: "Player's name"
        tests:
          - not_null
      - name: batting_order
        description: "Batting order position (e.g., '100' for leadoff)"
      - name: position
        description: "Defensive position (e.g., 'LF', 'SS', 'C')"
      - name: at_bats
        description: "Number of at-bats"
      - name: runs
        description: "Number of runs scored"
      - name: hits
        description: "Number of hits"
      - name: doubles
        description: "Number of doubles (2B)"
      - name: triples
        description: "Number of triples (3B)"
      - name: home_runs
        description: "Number of home runs (HR)"
      - name: rbi
        description: "Runs batted in"
      - name: stolen_bases
        description: "Number of stolen bases"
      - name: walks
        description: "Number of walks (BB)"
      - name: strikeouts
        description: "Number of strikeouts"
      - name: left_on_base
        description: "Number of runners left on base"
      - name: avg
        description: "Season batting average as of this game (from API)"
      - name: obp
        description: "Season on-base percentage as of this game (from API)"
      - name: slg
        description: "Season slugging percentage as of this game (from API)"
      - name: ops
        description: "Season on-base plus slugging as of this game (from API)"

  - name: stg_mlb__player_pitching_stats
    description: |
      MLB player pitching statistics staged from raw landing tables.
      Contains game-by-game pitching stats for each pitcher.
    columns:
      - name: game_id
        description: "Unique identifier for the game"
        tests:
          - not_null
      - name: player_id
        description: "Unique identifier for the player"
        tests:
          - not_null
      - name: team_id
        description: "Unique identifier for the team"
        tests:
          - not_null
      - name: player_name
        description: "Player's name"
        tests:
          - not_null
      - name: innings_pitched
        description: "Innings pitched (e.g., '5.2' for 5 2/3 innings)"
      - name: hits
        description: "Number of hits allowed"
      - name: runs
        description: "Number of runs allowed"
      - name: earned_runs
        description: "Number of earned runs allowed"
      - name: walks
        description: "Number of walks issued (BB)"
      - name: strikeouts
        description: "Number of strikeouts"
      - name: home_runs
        description: "Number of home runs allowed"
      - name: pitches
        description: "Total number of pitches thrown"
      - name: strikes
        description: "Number of strikes thrown"
      - name: era
        description: "Season earned run average as of this game (from API)"

  - name: stg_mlb__leagues
    description: "MLB leagues staged from raw landing tables"
    columns:
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
        tests:
          - not_null
          - unique
      - name: league_name
        description: "Full league name (e.g., 'American League', 'National League')"
        tests:
          - not_null
      - name: league_abbr
        description: "League abbreviation (e.g., 'AL', 'NL')"

  - name: stg_mlb__divisions
    description: "MLB divisions staged from raw landing tables"
    columns:
      - name: division_id
        description: "{{ doc('mlb_division_id') }}"
        tests:
          - not_null
          - unique
      - name: division_name
        description: "Full division name (e.g., 'American League East')"
        tests:
          - not_null
      - name: division_abbr
        description: "Division abbreviation (e.g., 'ALE', 'NLC', 'NLW')"
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
        tests:
          - relationships:
              arguments:
                to: ref('stg_mlb__leagues')
                field: league_id

  - name: stg_mlb__standings
    description: |
      MLB standings staged from raw landing tables.
      Each row represents a team's standings record on a specific date within a season.
      Supports weekly historical snapshots for division race tracking.
    columns:
      - name: team_id
        description: "Team identifier"
        tests:
          - not_null
      - name: season
        description: "Season year"
        tests:
          - not_null
      - name: standings_date
        description: "Date of the standings snapshot"
        tests:
          - not_null
      - name: league_id
        description: "League identifier (AL or NL)"
      - name: division_id
        description: "Division identifier"
      - name: division_rank
        description: "Team's rank within their division"
      - name: wins
        description: "Total wins as of this date"
      - name: losses
        description: "Total losses as of this date"
      - name: win_pct
        description: "Winning percentage"
      - name: games_back
        description: "Games behind division leader (0 = leader)"
      - name: wildcard_games_back
        description: "Games behind wild card cutoff"
      - name: streak
        description: "Current winning/losing streak code (e.g., 'W5', 'L3')"
      - name: last_ten_record
        description: "Record in last 10 games (e.g., '7-3')"

  - name: stg_mlb__players
    description: "MLB players staged from raw landing tables"
    columns:
      - name: player_id   
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
          - unique
      - name: full_name
        description: "{{ doc('mlb_full_name') }}"
      - name: first_name
        description: "{{ doc('mlb_first_name') }}"
      - name: last_name
        description: "{{ doc('mlb_last_name') }}"
      - name: primary_number
        description: "{{ doc('mlb_primary_number') }}"
      - name: birth_date
        description: "{{ doc('mlb_birth_date') }}"
      - name: current_age
        description: "{{ doc('mlb_current_age') }}"
      - name: birth_city
        description: "{{ doc('mlb_birth_city') }}"
      - name: birth_state_province
        description: "{{ doc('mlb_birth_state_province') }}"
      - name: birth_country
        description: "{{ doc('mlb_birth_country') }}"
      - name: height
        description: "{{ doc('mlb_height') }}"
      - name: weight
        description: "{{ doc('mlb_weight') }}"
      - name: primary_position_code
        description: "{{ doc('mlb_primary_position_code') }}"
      - name: primary_position_name
        description: "{{ doc('mlb_primary_position_name') }}"
      - name: primary_position_abbr
        description: "{{ doc('mlb_primary_position_abbr') }}"
      - name: bat_side_code
        description: "{{ doc('mlb_bat_side_code') }}"
      - name: bat_side_description
        description: "{{ doc('mlb_bat_side_description') }}"
      - name: pitch_hand_code
        description: "{{ doc('mlb_pitch_hand_code') }}"
      - name: pitch_hand_description
        description: "{{ doc('mlb_pitch_hand_description') }}"
      - name: mlb_debut_date
        description: "{{ doc('mlb_debut_date') }}"
      - name: active
        description: "{{ doc('mlb_active') }}"
      - name: raw
        description: "{{doc('mlb_raw_player') }}"

