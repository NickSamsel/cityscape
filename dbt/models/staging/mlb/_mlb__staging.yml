version: 2

models:
  - name: stg_mlb__games
    description: |
      MLB games staged from raw landing tables.
      Includes deduplication logic to ensure unique (game_id, season) combinations.
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests:
          - not_null
          - unique
      - name: season
        description: "{{ doc('mlb_season') }}"
        tests:
          - not_null
      - name: game_date
        description: "{{ doc('mlb_game_date') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('mlb_game_type') }}"
      - name: status
        description: "{{ doc('mlb_game_status') }}"
      - name: home_team_id
        description: "{{ doc('mlb_home_team_id') }}"
        tests:
          - not_null
      - name: away_team_id
        description: "{{ doc('mlb_away_team_id') }}"
        tests:
          - not_null
      - name: home_score
        description: "{{ doc('mlb_home_score') }}"
      - name: away_score
        description: "{{ doc('mlb_away_score') }}"

  - name: stg_mlb__teams
    description: "MLB teams staged from raw landing tables"
    columns:
      - name: team_id
        description: "{{ doc('mlb_team_id') }}"
        tests:
          - not_null
      - name: season
        description: "{{ doc('mlb_season') }}"
        tests:
          - not_null
      - name: team_name
        description: "{{ doc('mlb_team_name') }}"
        tests:
          - not_null
      - name: team_abbr
        description: "{{ doc('mlb_team_abbr') }}"
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
      - name: division_id
        description: "{{ doc('mlb_division_id') }}"

  - name: stg_mlb__player_batting_stats
    description: |
      MLB player batting statistics staged from raw landing tables.
      Contains game-by-game batting stats for each player.
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests:
          - not_null
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
      - name: team_id
        description: "{{ doc('mlb_team_id') }}"
        tests:
          - not_null
      - name: player_name
        description: "{{ doc('mlb_player_name') }}"
        tests:
          - not_null
      - name: batting_order
        description: "{{ doc('mlb_batting_order') }}"
      - name: position
        description: "{{ doc('mlb_position') }}"
      - name: at_bats
        description: "{{ doc('mlb_at_bats') }}"
      - name: runs
        description: "{{ doc('mlb_runs') }}"
      - name: hits
        description: "{{ doc('mlb_hits') }}"
      - name: doubles
        description: "{{ doc('mlb_doubles') }}"
      - name: triples
        description: "{{ doc('mlb_triples') }}"
      - name: home_runs
        description: "{{ doc('mlb_home_runs') }}"
      - name: rbi
        description: "{{ doc('mlb_rbi') }}"
      - name: stolen_bases
        description: "{{ doc('mlb_stolen_bases') }}"
      - name: walks
        description: "{{ doc('mlb_walks') }}"
      - name: strikeouts
        description: "{{ doc('mlb_strikeouts') }}"
      - name: left_on_base
        description: "{{ doc('mlb_left_on_base') }}"
      - name: avg
        description: "{{ doc('mlb_avg') }}"
      - name: obp
        description: "{{ doc('mlb_obp') }}"
      - name: slg
        description: "{{ doc('mlb_slg') }}"
      - name: ops
        description: "{{ doc('mlb_ops') }}"

  - name: stg_mlb__player_pitching_stats
    description: |
      MLB player pitching statistics staged from raw landing tables.
      Contains game-by-game pitching stats for each pitcher.
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests:
          - not_null
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
      - name: team_id
        description: "{{ doc('mlb_team_id') }}"
        tests:
          - not_null
      - name: player_name
        description: "{{ doc('mlb_player_name') }}"
        tests:
          - not_null
      - name: innings_pitched
        description: "{{ doc('mlb_innings_pitched') }}"
      - name: hits
        description: "{{ doc('mlb_hits') }}"
      - name: runs
        description: "{{ doc('mlb_runs') }}"
      - name: earned_runs
        description: "{{ doc('mlb_earned_runs') }}"
      - name: walks
        description: "{{ doc('mlb_walks') }}"
      - name: strikeouts
        description: "{{ doc('mlb_strikeouts') }}"
      - name: home_runs
        description: "{{ doc('mlb_home_runs') }}"
      - name: pitches
        description: "{{ doc('mlb_pitches') }}"
      - name: strikes
        description: "{{ doc('mlb_strikes') }}"
      - name: era
        description: "{{ doc('mlb_era') }}"

  - name: stg_mlb__leagues
    description: "MLB leagues staged from raw landing tables"
    columns:
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
        tests:
          - not_null
          - unique
      - name: league_name
        description: "{{ doc('mlb_league_name') }}"
        tests:
          - not_null
      - name: league_abbr
        description: "{{ doc('mlb_league_abbr') }}"

  - name: stg_mlb__divisions
    description: "MLB divisions staged from raw landing tables"
    columns:
      - name: division_id
        description: "{{ doc('mlb_division_id') }}"
        tests:
          - not_null
          - unique
      - name: division_name
        description: "{{ doc('mlb_division_name') }}"
        tests:
          - not_null
      - name: division_abbr
        description: "{{ doc('mlb_division_abbr') }}"
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
        tests:
          - relationships:
              arguments:
                to: ref('stg_mlb__leagues')
                field: league_id

  - name: stg_mlb__standings
    description: |
      MLB standings staged from raw landing tables.
      Each row represents a team's standings record on a specific date within a season.
      Supports weekly historical snapshots for division race tracking.
    columns:
      - name: team_id
        description: "{{ doc('mlb_team_id') }}"
        tests:
          - not_null
      - name: season
        description: "{{ doc('mlb_season') }}"
        tests:
          - not_null
      - name: standings_date
        description: "{{ doc('mlb_standings_date') }}"
        tests:
          - not_null
      - name: league_id
        description: "{{ doc('mlb_league_id') }}"
      - name: division_id
        description: "{{ doc('mlb_division_id') }}"
      - name: division_rank
        description: "{{ doc('mlb_division_rank') }}"
      - name: wins
        description: "{{ doc('mlb_wins') }}"
      - name: losses
        description: "{{ doc('mlb_losses') }}"
      - name: win_pct
        description: "{{ doc('mlb_win_pct') }}"
      - name: games_back
        description: "{{ doc('mlb_games_back') }}"
      - name: wildcard_games_back
        description: "{{ doc('mlb_wildcard_games_back') }}"
      - name: streak
        description: "{{ doc('mlb_streak') }}"
      - name: last_ten_record
        description: "{{ doc('mlb_last_ten_record') }}"

  - name: stg_mlb__schedule
    description: |
      MLB game schedule with venue, game time, probable pitchers, and metadata.
      Each row represents a single scheduled game with enriched context.
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests:
          - not_null
          - unique
      - name: season
        description: "{{ doc('mlb_season') }}"
        tests:
          - not_null
      - name: game_date
        description: "{{ doc('mlb_game_date') }}"
      - name: game_datetime
        description: "{{ doc('mlb_game_datetime') }}"
      - name: venue_id
        description: "{{ doc('mlb_venue_id') }}"
      - name: venue_name
        description: "{{ doc('mlb_venue_name') }}"
      - name: home_probable_pitcher_id
        description: "{{ doc('mlb_home_probable_pitcher_id') }}"
      - name: home_probable_pitcher_name
        description: "{{ doc('mlb_home_probable_pitcher_name') }}"
      - name: away_probable_pitcher_id
        description: "{{ doc('mlb_away_probable_pitcher_id') }}"
      - name: away_probable_pitcher_name
        description: "{{ doc('mlb_away_probable_pitcher_name') }}"
      - name: day_night
        description: "{{ doc('mlb_day_night') }}"
      - name: series_description
        description: "{{ doc('mlb_series_description') }}"

  - name: stg_mlb__game_broadcasts
    description: |
      Broadcast information for MLB games (TV, radio).
      Each row represents a single broadcast outlet for a game.
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests:
          - not_null
      - name: broadcast_name
        description: "{{ doc('mlb_broadcast_name') }}"
        tests:
          - not_null
      - name: broadcast_type
        description: "{{ doc('mlb_broadcast_type') }}"
      - name: call_sign
        description: "{{ doc('mlb_call_sign') }}"
      - name: is_national
        description: "{{ doc('mlb_is_national') }}"
      - name: home_away
        description: "{{ doc('mlb_broadcast_home_away') }}"

  - name: stg_mlb__game_lineups
    description: |
      Starting lineups for MLB games.
      Each row represents a player's spot in the starting lineup.
      Lineups are typically set 1-2 hours before first pitch.
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests:
          - not_null
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
      - name: team_side
        description: "{{ doc('mlb_team_side') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: full_name
        description: "{{ doc('mlb_full_name') }}"
      - name: position_abbreviation
        description: "{{ doc('mlb_lineup_position_abbreviation') }}"
      - name: batting_order
        description: "{{ doc('mlb_lineup_batting_order') }}"

  - name: stg_mlb__players
    description: "MLB players staged from raw landing tables"
    columns:
      - name: player_id
        description: "{{ doc('mlb_player_id') }}"
        tests:
          - not_null
          - unique
      - name: full_name
        description: "{{ doc('mlb_full_name') }}"
      - name: first_name
        description: "{{ doc('mlb_first_name') }}"
      - name: last_name
        description: "{{ doc('mlb_last_name') }}"
      - name: primary_number
        description: "{{ doc('mlb_primary_number') }}"
      - name: birth_date
        description: "{{ doc('mlb_birth_date') }}"
      - name: current_age
        description: "{{ doc('mlb_current_age') }}"
      - name: birth_city
        description: "{{ doc('mlb_birth_city') }}"
      - name: birth_state_province
        description: "{{ doc('mlb_birth_state_province') }}"
      - name: birth_country
        description: "{{ doc('mlb_birth_country') }}"
      - name: height
        description: "{{ doc('mlb_height') }}"
      - name: weight
        description: "{{ doc('mlb_weight') }}"
      - name: primary_position_code
        description: "{{ doc('mlb_primary_position_code') }}"
      - name: primary_position_name
        description: "{{ doc('mlb_primary_position_name') }}"
      - name: primary_position_abbr
        description: "{{ doc('mlb_primary_position_abbr') }}"
      - name: bat_side_code
        description: "{{ doc('mlb_bat_side_code') }}"
      - name: bat_side_description
        description: "{{ doc('mlb_bat_side_description') }}"
      - name: pitch_hand_code
        description: "{{ doc('mlb_pitch_hand_code') }}"
      - name: pitch_hand_description
        description: "{{ doc('mlb_pitch_hand_description') }}"
      - name: mlb_debut_date
        description: "{{ doc('mlb_debut_date') }}"
      - name: active
        description: "{{ doc('mlb_active') }}"
      - name: raw
        description: "{{doc('mlb_raw_player') }}"
