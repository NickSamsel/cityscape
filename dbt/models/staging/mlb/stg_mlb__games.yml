version: 2

models:
  - name: stg_mlb__games
    description: "MLB games staged from raw landing tables"
    columns:
      - name: game_id
        description: "{{ doc('mlb_game_id') }}"
        tests: [not_null, unique]
      - name: season
        description: "{{ doc('mlb_season') }}"
        tests: [not_null]
      - name: game_date
        description: "{{ doc('mlb_game_date') }}"
        tests: [not_null]
      - name: game_type
        description: "{{ doc('mlb_game_type') }}"
      - name: status
        description: "{{ doc('mlb_game_status') }}"
      - name: home_team_id
        description: "{{ doc('mlb_home_team_id') }}"
        tests: [not_null]
      - name: away_team_id
        description: "{{ doc('mlb_away_team_id') }}"
        tests: [not_null]
      - name: home_score
        description: "{{ doc('mlb_home_score') }}"
      - name: away_score
        description: "{{ doc('mlb_away_score') }}"
