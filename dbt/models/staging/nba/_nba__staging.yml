version: 2

models:
  - name: stg_nba__games
    description: |
      NBA games staged from raw landing tables.
      Includes deduplication logic to ensure unique game_id.
    columns:
      - name: game_id
        description: "{{ doc('nba_game_id') }}"
        tests:
          - not_null
          - unique
      - name: season
        description: "{{ doc('nba_season') }}"
        tests:
          - not_null
      - name: game_date
        description: "{{ doc('nba_game_date') }}"
        tests:
          - not_null
      - name: season_type
        description: "{{ doc('nba_season_type') }}"
      - name: status
        description: "{{ doc('nba_status') }}"
      - name: home_team_id
        description: "{{ doc('nba_home_team_id') }}"
        tests:
          - not_null
      - name: away_team_id
        description: "{{ doc('nba_away_team_id') }}"
        tests:
          - not_null
      - name: home_score
        description: "{{ doc('nba_home_score') }}"
      - name: away_score
        description: "{{ doc('nba_away_score') }}"
      - name: arena
        description: "{{ doc('nba_arena') }}"
      - name: attendance
        description: "{{ doc('nba_attendance') }}"

  - name: stg_nba__teams
    description: "NBA teams staged from raw landing tables"
    columns:
      - name: team_id
        description: "{{ doc('nba_team_id') }}"
        tests:
          - not_null
          - unique
      - name: team_name
        description: "{{ doc('nba_team_name') }}"
        tests:
          - not_null
      - name: team_abbr
        description: "{{ doc('nba_team_abbr') }}"
      - name: team_city
        description: "{{ doc('nba_team_city') }}"
      - name: conference_id
        description: "{{ doc('nba_conference_id') }}"
      - name: division_id
        description: "{{ doc('nba_division_id') }}"
      - name: year_founded
        description: "{{ doc('nba_year_founded') }}"

  - name: stg_nba__player_game_stats
    description: |
      NBA player game statistics staged from raw landing tables.
      Contains game-by-game player stats for each NBA game.
    columns:
      - name: game_id
        description: "{{ doc('nba_game_id') }}"
        tests:
          - not_null
      - name: player_id
        description: "{{ doc('nba_player_id') }}"
        tests:
          - not_null
      - name: team_id
        description: "{{ doc('nba_team_id') }}"
        tests:
          - not_null
      - name: player_name
        description: "{{ doc('nba_player_name') }}"
        tests:
          - not_null
      - name: starter
        description: "{{ doc('nba_starter') }}"
      - name: minutes
        description: "{{ doc('nba_minutes') }}"
      - name: field_goals_made
        description: "{{ doc('nba_field_goals_made') }}"
      - name: field_goals_attempted
        description: "{{ doc('nba_field_goals_attempted') }}"
      - name: field_goal_pct
        description: "{{ doc('nba_field_goal_pct') }}"
      - name: three_pointers_made
        description: "{{ doc('nba_three_pointers_made') }}"
      - name: three_pointers_attempted
        description: "{{ doc('nba_three_pointers_attempted') }}"
      - name: three_point_pct
        description: "{{ doc('nba_three_point_pct') }}"
      - name: free_throws_made
        description: "{{ doc('nba_free_throws_made') }}"
      - name: free_throws_attempted
        description: "{{ doc('nba_free_throws_attempted') }}"
      - name: free_throw_pct
        description: "{{ doc('nba_free_throw_pct') }}"
      - name: offensive_rebounds
        description: "{{ doc('nba_offensive_rebounds') }}"
      - name: defensive_rebounds
        description: "{{ doc('nba_defensive_rebounds') }}"
      - name: total_rebounds
        description: "{{ doc('nba_total_rebounds') }}"
      - name: assists
        description: "{{ doc('nba_assists') }}"
      - name: steals
        description: "{{ doc('nba_steals') }}"
      - name: blocks
        description: "{{ doc('nba_blocks') }}"
      - name: turnovers
        description: "{{ doc('nba_turnovers') }}"
      - name: personal_fouls
        description: "{{ doc('nba_personal_fouls') }}"
      - name: points
        description: "{{ doc('nba_points') }}"
      - name: plus_minus
        description: "{{ doc('nba_plus_minus') }}"

  - name: stg_nba__conferences
    description: "NBA conferences staged from raw landing tables"
    columns:
      - name: conference_id
        description: "{{ doc('nba_conference_id') }}"
        tests:
          - not_null
          - unique
      - name: conference_name
        description: "{{ doc('nba_conference_name') }}"
        tests:
          - not_null
      - name: conference_abbr
        description: "{{ doc('nba_conference_abbr') }}"

  - name: stg_nba__divisions
    description: "NBA divisions staged from raw landing tables"
    columns:
      - name: division_id
        description: "{{ doc('nba_division_id') }}"
        tests:
          - not_null
          - unique
      - name: division_name
        description: "{{ doc('nba_division_name') }}"
        tests:
          - not_null
      - name: division_abbr
        description: "{{ doc('nba_division_abbr') }}"
      - name: conference_id
        description: "{{ doc('nba_conference_id') }}"
        tests:
          - relationships:
              arguments:
                to: ref('stg_nba__conferences')
                field: conference_id

  - name: stg_nba__players
    description: "NBA players staged from raw landing tables"
    columns:
      - name: player_id
        description: "{{ doc('nba_player_id') }}"
        tests:
          - not_null
          - unique
      - name: full_name
        description: "{{ doc('nba_full_name') }}"
      - name: first_name
        description: "{{ doc('nba_first_name') }}"
      - name: last_name
        description: "{{ doc('nba_last_name') }}"
      - name: jersey_number
        description: "{{ doc('nba_jersey_number') }}"
      - name: position
        description: "{{ doc('nba_position') }}"
      - name: height
        description: "{{ doc('nba_height') }}"
      - name: weight
        description: "{{ doc('nba_weight') }}"
      - name: birth_date
        description: "{{ doc('nba_birth_date') }}"
      - name: country
        description: "{{ doc('nba_country') }}"
      - name: draft_year
        description: "{{ doc('nba_draft_year') }}"
      - name: draft_round
        description: "{{ doc('nba_draft_round') }}"
      - name: draft_number
        description: "{{ doc('nba_draft_number') }}"
      - name: is_active
        description: "{{ doc('nba_is_active') }}"

  - name: stg_nba__shot_chart
    description: |
      NBA individual shot attempts staged from raw landing tables.
      Similar to MLB Statcast - captures every shot with location, type, and outcome.
      Perfect for shot chart visualizations and advanced shooting analytics.
    columns:
      - name: game_id
        description: "Unique identifier for the NBA game"
        tests:
          - not_null
      - name: game_event_id
        description: "Unique event ID within the game for this shot"
        tests:
          - not_null
      - name: player_id
        description: "Unique identifier for the player who took the shot"
        tests:
          - not_null
      - name: player_name
        description: "Name of the player who took the shot"
      - name: team_id
        description: "Unique identifier for the team"
        tests:
          - not_null
      - name: team_name
        description: "Name of the team"
      - name: period
        description: "Quarter/period of the game (1-4, 5+ for OT)"
      - name: minutes_remaining
        description: "Minutes remaining in the period when shot was taken"
      - name: seconds_remaining
        description: "Seconds remaining in the period when shot was taken"
      - name: event_type
        description: "Type of event (Made Shot, Missed Shot)"
      - name: action_type
        description: "Specific type of shot (Jump Shot, Layup, Dunk, etc.)"
      - name: shot_type
        description: "2PT Field Goal or 3PT Field Goal"
      - name: shot_zone_basic
        description: "Basic shot zone (Above the Break 3, In The Paint, Mid-Range, etc.)"
      - name: shot_zone_area
        description: "Area of the court (Left Side, Right Side, Center, Back Court)"
      - name: shot_zone_range
        description: "Distance range (Less Than 8 ft, 8-16 ft, 16-24 ft, 24+ ft)"
      - name: shot_distance
        description: "Distance of shot in feet"
      - name: loc_x
        description: "X coordinate on court (-250 to 250)"
      - name: loc_y
        description: "Y coordinate on court (0 to 940)"
      - name: shot_attempted_flag
        description: "1 if shot was attempted"
      - name: shot_made_flag
        description: "1 if shot was made, 0 if missed"
      - name: game_date
        description: "Date when the game was played"
      - name: htm
        description: "Home team abbreviation"
      - name: vtm
        description: "Visiting team abbreviation"
