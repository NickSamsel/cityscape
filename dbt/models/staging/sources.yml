version: 2

# Raw landing tables live in a single schema (default: `raw`) and use league-prefixed table names.
# Example raw tables: raw.nba_games, raw.mlb_games, raw.nhl_games, raw.nfl_games

sources:
  - name: raw
    schema: "{{ var('raw_schema', 'raw') }}"
    tables:
      # NBA
      - name: nba_games
      - name: nba_teams
      - name: nba_player_game_stats
      - name: nba_conferences
      - name: nba_divisions
      - name: nba_players
      - name: nba_shot_chart

      # MLB
      - name: mlb_games
      - name: mlb_teams
      - name: mlb_leagues
      - name: mlb_divisions
      - name: mlb_players
      - name: mlb_rosters
      - name: mlb_player_batting_stats
      - name: mlb_player_pitching_stats
      - name: mlb_statcast_pitches
      - name: mlb_statcast_batted_balls
      - name: mlb_standings
      - name: mlb_schedule
      - name: mlb_game_broadcasts
      - name: mlb_game_lineups
      - name: mlb_venues

      # NHL
      - name: nhl_games
      - name: nhl_teams

      # NFL
      - name: nfl_games
      - name: nfl_teams

  # ML model predictions (populated by external ML inference pipeline)
  - name: mlb_modeling
    schema: mlb_modeling
    tables:
      - name: ml_mlb__model_predictions_raw
        description: "Raw model predictions from ML inference pipeline (beat-the-streak-ml repo)"
        columns:
          - name: player_id
            description: "Player identifier"
            tests:
              - not_null
          - name: game_date
            description: "Date of the game being predicted"
            tests:
              - not_null
          - name: pitcher_id
            description: "Opposing pitcher identifier"
            tests:
              - not_null
          - name: game_id
            description: "Game identifier"
            tests:
              - not_null
          - name: hit_probability
            description: "Model-predicted probability of getting a hit (0.0-1.0)"
            tests:
              - not_null
          - name: model_version
            description: "Model version string (e.g., v3.0.0)"
            tests:
              - not_null
          - name: predicted_at
            description: "UTC timestamp when prediction was generated"
            tests:
              - not_null
