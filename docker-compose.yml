services:
  gcp-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    container_name: cityscape-gcp-proxy
    environment:
      - CSQL_PROXY_JSON_CREDENTIALS=${GCP_SERVICE_ACCOUNT_KEY}
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${GCP_SQL_INSTANCE}"
    restart: always

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cityscape-dev
    depends_on:
      - gcp-proxy
    # This script sets up GCP credentials, dbt, and starts Prefect server
    entrypoint: >
      bash -c "
      if [ -z \"$$GCP_SERVICE_ACCOUNT_KEY\" ]; then
        echo 'WARNING: GCP_SERVICE_ACCOUNT_KEY is empty';
      else
        echo \"$$GCP_SERVICE_ACCOUNT_KEY\" > /tmp/gcp-key.json;
        echo 'GCP service account key written to /tmp/gcp-key.json';
      fi;
      echo 'Creating dbt profiles.yml...';
      cat > /workspaces/cityscape/dbt/profiles.yml <<EOF
cityscape:
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: /tmp/gcp-key.json
      project: \"$$GCP_PROJECT_ID\"
      dataset: raw
      threads: 4
      timeout_seconds: 300
      location: US
      priority: interactive
  target: dev
EOF
      echo 'Installing dbt packages...';
      cd /workspaces/cityscape/dbt && uv run dbt deps --profiles-dir . 2>&1 | grep -E '(Installing|Installed|Up to date)' || true;
      echo 'Installing project dependencies...';
      cd /workspaces/cityscape && uv sync --no-cache 2>&1 | grep -E '(Resolved|Installed|error)' || true;
      echo 'Starting Prefect server on http://localhost:4200...';
      prefect server start --host 0.0.0.0 > /tmp/prefect-server.log 2>&1 &
      echo 'Prefect server started (logs at /tmp/prefect-server.log)';
      sleep infinity"
    environment:
      - GCP_SERVICE_ACCOUNT_KEY=${GCP_SERVICE_ACCOUNT_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - DOCKER_API_VERSION=1.43
      - DBT_HOST=gcp-proxy
      - DBT_PORT=5432
      - DBT_USER=${GCP_DB_USER}
      - DBT_PASSWORD=${GCP_DB_PASSWORD}
      - DBT_DBNAME=${GCP_DB_NAME}
      - DBT_PROFILES_DIR=/workspaces/cityscape/dbt
      - PREFECT_API_URL=http://localhost:4200/api
    ports:
      - "4200:4200"
    volumes:
      - .:/workspaces/cityscape:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp