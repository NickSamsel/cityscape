services:
  # 1. REMOVED the local postgres service block entirely

  prefect:
    build:
      context: .
      dockerfile: Dockerfile
    image: cityscape:dev
    container_name: cityscape-prefect
    working_dir: /workspaces/cityscape
    volumes:
      - .:/workspaces/cityscape:cached
      - prefect-home:/root/.prefect
      - cityscape-uv-cache:/root/.cache/uv
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0 --port 4200

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: cityscape:dev
    container_name: cityscape-dev
    working_dir: /workspaces/cityscape
    env_file:
      - path: .env
        required: false  # 2. Fixes your "file not found" error
    depends_on:
      prefect:
        condition: service_started
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - DBT_PROFILES_DIR=/workspaces/cityscape/dbt
      # 3. Update these to your GCP Cloud SQL Credentials
      - DBT_HOST=${GCP_DB_HOST} 
      - DBT_PORT=5432
      - DBT_USER=${GCP_DB_USER}
      - DBT_PASSWORD=${GCP_DB_PASSWORD}
      - DBT_DBNAME=${GCP_DB_NAME}
      - DBT_SCHEMA=analytics
    volumes:
      - .:/workspaces/cityscape:cached
      - cityscape-venv:/workspaces/cityscape/.venv
      - cityscape-uv-cache:/root/.cache/uv
    command: sleep infinity

  prefect-worker:
    image: cityscape:dev
    container_name: cityscape-prefect-worker
    working_dir: /workspaces/cityscape
    depends_on:
      prefect:
        condition: service_started
    # No longer depends on a local postgres healthcheck
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - DBT_PROFILES_DIR=/workspaces/cityscape/dbt
      - DBT_HOST=${GCP_DB_HOST}
      - DBT_PORT=5432
      - DBT_USER=${GCP_DB_USER}
      - DBT_PASSWORD=${GCP_DB_PASSWORD}
      - DBT_DBNAME=${GCP_DB_NAME}
      - DBT_SCHEMA=analytics
    volumes:
      - .:/workspaces/cityscape:cached
      - cityscape-venv:/workspaces/cityscape/.venv
      - cityscape-uv-cache:/root/.cache/uv
    command: >-
      sh -lc
      "uv pip install -e '.[dev]' &&
       uv run prefect work-pool create cityscape-pool --type process --overwrite || true &&
       uv run prefect worker start --pool cityscape-pool --type process"

volumes:
  # postgres-data volume removed as it's no longer used
  cityscape-venv:
  cityscape-uv-cache:
  prefect-home: