# Daily MLB data ingestion pipeline (OPTIMIZED ROSTER-BASED WORKFLOW)
#
# Runs every morning at 6 AM ET (10 AM UTC) to pick up results from the
# previous night's games. Uses the optimized roster-based workflow for
# 99.4% fewer API calls.
#
# WHAT THIS DOES:
# - Fetches last 3 days of data (catches stat corrections)
# - Updates rosters automatically on Mondays (weekly refresh)
# - Ingests teams, games, player stats, standings, schedule
# - Optionally includes Statcast data (slower but more complete)
#
# FOR HISTORICAL DATA (2000-2026):
# Run scripts/mlb/ingest_historical_backfill.py ONCE manually or via workflow_dispatch
#
# The MLB Stats API is free, unauthenticated, and updated in near real-time.
#
# Cost: ~5-10 min/run during season (Apr-Oct) = ~150-300 min/month,
# well within GitHub's free 2,000 min/month allowance.
#
# Required GitHub Secrets:
#   GCP_SERVICE_ACCOUNT_KEY  - base64-encoded GCP service account JSON
#   GCP_PROJECT_ID           - BigQuery project ID

name: MLB Daily Ingest

on:
  schedule:
    # 10:00 UTC = 6:00 AM ET — after west coast games finish
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "MLB season year (default: current year)"
        required: false
        type: number
      lookback_days:
        description: "Days to look back for updates (default: 3 for stat corrections)"
        required: false
        default: 3
        type: number
      skip_statcast:
        description: "Skip Statcast ingestion (faster)"
        required: false
        default: false
        type: boolean
      update_rosters:
        description: "Force roster update (default: auto on Mondays)"
        required: false
        default: false
        type: boolean

jobs:
  ingest:
    name: Ingest MLB data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Skip off-season runs (save CI minutes). The Python script also has its
    # own season guard, but this avoids even spinning up the runner.
    # MLB regular season: late March through early October.
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json

    steps:
      - name: Check if in-season (skip Nov-Feb)
        id: season_check
        run: |
          month=$(date +%m)
          if [ "$month" -ge 11 ] || [ "$month" -le 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Off-season (month=$month), skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.season_check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.season_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.season_check.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: steps.season_check.outputs.skip != 'true'
        run: uv sync --no-dev

      - name: Write GCP credentials
        if: steps.season_check.outputs.skip != 'true'
        run: echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/gcp-key.json

      - name: Create dbt profiles.yml
        if: steps.season_check.outputs.skip != 'true'
        run: |
          cat > dbt/profiles.yml <<EOF
          cityscape:
            outputs:
              dev:
                type: bigquery
                method: service-account
                keyfile: /tmp/gcp-key.json
                project: ${GCP_PROJECT_ID}
                dataset: raw
                threads: 4
                timeout_seconds: 300
                location: US
                priority: interactive
            target: dev
          EOF
          echo "Created dbt/profiles.yml with project: ${GCP_PROJECT_ID}"

      - name: Run MLB daily ingestion
        if: steps.season_check.outputs.skip != 'true'
        run: |
          # Default: 3-day lookback (catches stat corrections)
          LOOKBACK="${{ inputs.lookback_days || 3 }}"
          
          # Build arguments
          ARGS="--lookback-days $LOOKBACK"
          
          # Add season if specified
          if [ -n "${{ inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ inputs.season }}"
          fi
          
          # Skip Statcast if requested
          if [ "${{ inputs.skip_statcast }}" = "true" ]; then
            ARGS="$ARGS --skip-statcast"
          fi
          
          # Roster updates: auto on Mondays, or force if requested
          if [ "${{ inputs.update_rosters }}" = "true" ]; then
            echo "Force roster update requested"
            # Don't add --update-rosters-weekly, rosters will update
          else
            # Auto-update rosters on Mondays only (efficient)
            ARGS="$ARGS --update-rosters-weekly"
          fi
          
          echo "Running: uv run python scripts/mlb/daily_ingest.py $ARGS"
          uv run python scripts/mlb/daily_ingest.py $ARGS

      - name: Run dbt build (MLB incremental)
        if: steps.season_check.outputs.skip != 'true'
        working-directory: dbt
        run: |
          uv run dbt deps --profiles-dir .
          uv run dbt build --select tag:mlb --target dev --profiles-dir .

      - name: Build prediction dataset
        if: steps.season_check.outputs.skip != 'true'
        working-directory: dbt
        run: |
          # Build the prediction dataset for today's games
          uv run dbt run --select ml_mlb__prediction_dataset --target dev --profiles-dir .
          echo "Prediction dataset built successfully"

      - name: Trigger ML inference workflow
        if: steps.season_check.outputs.skip != 'true'
        run: |
          # Trigger the ML repo's daily prediction workflow
          # This assumes the ML repo workflow is set up to accept repository_dispatch events

          # Get today's date for prediction
          PREDICTION_DATE=$(date +%Y-%m-%d)

          echo "Triggering ML inference for date: $PREDICTION_DATE"

          # Option 1: Using repository_dispatch (recommended)
          # Uncomment and configure the following once ML repo workflow_dispatch is set up:
          # curl -X POST \
          #   -H "Authorization: token ${{ secrets.ML_REPO_DISPATCH_TOKEN }}" \
          #   -H "Accept: application/vnd.github.v3+json" \
          #   https://api.github.com/repos/${{ secrets.ML_REPO_OWNER }}/beat-the-streak-ml/dispatches \
          #   -d "{\"event_type\":\"run_predictions\",\"client_payload\":{\"date\":\"$PREDICTION_DATE\"}}"

          # For now, log that this step would trigger inference
          echo "ML inference trigger placeholder - configure secrets.ML_REPO_DISPATCH_TOKEN and secrets.ML_REPO_OWNER"
          echo "Once configured, this will trigger predictions for $PREDICTION_DATE"

      - name: Wait for predictions (with timeout)
        if: steps.season_check.outputs.skip != 'true'
        run: |
          # Wait for ML predictions to be written to BigQuery
          # This is a polling mechanism with timeout

          PREDICTION_DATE=$(date +%Y-%m-%d)
          TIMEOUT=600  # 10 minutes
          ELAPSED=0
          CHECK_INTERVAL=30  # Check every 30 seconds

          echo "Waiting for predictions to appear in mlb_modeling.ml_mlb__model_predictions_raw for $PREDICTION_DATE..."

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Check if predictions exist for today
            COUNT=$(bq query --use_legacy_sql=false --format=csv --quiet \
              "SELECT COUNT(*) as cnt FROM \`${{ secrets.GCP_PROJECT_ID }}.mlb_modeling.ml_mlb__model_predictions_raw\` WHERE game_date = '$PREDICTION_DATE'" \
              | tail -n 1)

            if [ "$COUNT" -gt 0 ]; then
              echo "Found $COUNT predictions for $PREDICTION_DATE"
              break
            fi

            echo "No predictions yet (elapsed: ${ELAPSED}s / ${TIMEOUT}s)..."
            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "WARNING: Timeout waiting for predictions. Continuing anyway..."
            echo "Check ml_mlb__model_predictions_raw table manually."
            # Don't fail the workflow - predictions might come later
          else
            echo "Predictions are ready!"
          fi

      - name: Build prediction models (daily predictions and outcomes)
        if: steps.season_check.outputs.skip != 'true'
        working-directory: dbt
        run: |
          # Build the downstream prediction models
          uv run dbt run --select ml_mlb__daily_predictions ml_mlb__prediction_outcomes --target dev --profiles-dir .
          echo "Prediction models built successfully"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-key.json
